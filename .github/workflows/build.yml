# Rebuilds the site whenever content or images change, then commits the result.
# This lets the site be updated from GitHub's website alone (no tools needed).
name: Build site

on:
  push:
    branches: [master, main, redesign-2026]
    paths:
      - "content/**"
      - "images/src/**"
      - "templates/**"
      - "build.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jinja2 pillow
      - run: python3 build.py
      - name: Commit rebuilt pages
        run: |
          git config user.name "site-builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to update."; exit 0; fi
          git commit -m "Rebuild site"
          git push
