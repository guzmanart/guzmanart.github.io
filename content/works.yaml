# ---------- Pastel ----------
- slug: indigo-girl
  title: Indigo Girl
  collection: pastel
  medium: Pastel
  year: 2017
  featured: true
  process: 2
  statement: |
    Light on dark skin fascinates me. It reflects dozens of colors: violets,
    sapphires, cerulean, even vermilion. To create the undertones on Indigo Girl,
    I applied hard pastel according to the planes of the face, in bright blues
    and purples, then lighter tones in the second and third layers. The effect
    of inner illumination makes her appear to be her own light source.

    Indigo was a slave crop of the Chesapeake Bay.

- slug: dreamer
  title: "Dreamer (21st Century Trail of Tears)"
  collection: pastel
  medium: Pastel
  year: 2018
  featured: true
  process: 2
  statement: |
    I love portraiture. I think people are the most interesting subjects to
    paint. DACA Dreamers reminded me of the Native Americans of the
    nineteenth-century Trail of Tears, so my 21st Century Trail of Tears
    illustrates the irony of our immigration debates.

    This Dreamer is my version of a modern-day Statue of Liberty. She could be
    Latina, Native American or mixed, legal or undocumented. She begs the
    question: who is really American?

- slug: liberadora
  title: Liberadora
  collection: pastel
  medium: Pastel
  year: 2018
  process: 2
  statement: |
    Shellshock. Light and shadow on her face. Liberadora is a freedom fighter in
    the Spanish Civil War. Aerial bombs have destroyed her town, and there is
    chaos all around her: a mother clinging to her bundle, a limp child, and a
    horse galloping through the broken bodies peek through the smoke. This is
    how I envision my freedom fighter of Guernica.

- slug: hester
  title: Hester
  collection: pastel
  medium: Pastel
  year: 2018
  process: 1
  statement: |
    Hester is a young woman whose hair is graying. She could be Hester Prynne
    from The Scarlet Letter, or a woman of the Salem witch trials. Stunned, she
    looks her accuser in the eye.

    I blended flesh, golden and yellow ochres with unexpected English and
    turquoise blues, and purplish blue-greys for shading her face and
    collarbones.

- slug: north
  title: North
  collection: pastel
  medium: Pastel
  year: 2017
  process: 1
  statement: |
    This North Korean woman stands at the border between light and dark. Kim
    Jong Un's profile lurches in the shadows as light shines from her other
    side. Her face is mask-like, to reflect the oppressive regime, and carries
    the red and blue of the yin and yang on the South Korean flag.

