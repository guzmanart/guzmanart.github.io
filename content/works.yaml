# Every artwork on the site. Works appear in this order within each collection.
#
# Fields:
#   slug        unique id, lowercase-with-dashes; the main image is images/src/<slug>.jpg
#   title       shown in italics
#   collection  one of the collection slugs in site.yaml (oil, pastel, watercolor, drawing)
#   medium, size, year   optional; leave out or "" if unknown
#   featured    true = shown on the home page (keep about 6)
#   status      optional: available / sold / private / commission
#   statement   optional paragraph(s) about the work
#   details     optional extra images (close-ups): images/src/<slug>-detail-1.jpg, ...
#   process     optional in-progress photos: images/src/<slug>-process-1.jpg, ...
#   (details/process are just counts: details: 2 means -detail-1 and -detail-2)

