# Site-wide text and settings. Edit freely, then run `python3 build.py`.

name: Clara Guzman
tagline: Painting & Drawing
url: https://guzmanart.github.io

# One or two sentences shown on the home page.
intro: >-
  Clara Guzman paints portraits, figures and still lifes in oil, pastel and
  watercolor. She studied painting in the classical tradition at the School
  of Sacred Art in Florence, Italy.

# About page. Separate paragraphs with a blank line.
bio: |
  Clara Guzman is a figurative artist. Her work moves between oil painting,
  pastel portraiture, watercolor and drawing from life, and returns again and
  again to the human face.

  She spent a year studying painting at the School of Sacred Art in Florence,
  Italy, where she trained in drawing and oil painting in the classical
  tradition.

  Before Florence, her pastel portraits explored identity, history and light
  on skin, from Indigo Girl to Dreamer. She studied at Harvard College.

